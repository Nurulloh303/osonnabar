# osonNavbat — production (api.qulaynavbat.uz)
#
#   cp .env.production.example .env   # va to'ldiring
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Dev'dagi docker-compose.yml dan farqi:
#   • db/redis portlari TASHQARIGA CHIQARILMAGAN (dev'da 5432 va 6379 ochiq edi —
#     public IP li serverda bu bazani internetga qo'yish demak);
#   • runserver emas, gunicorn;
#   • kod volume bilan mount qilinmaydi (obrazdagi versiya ishlaydi);
#   • demo ma'lumot seed qilinmaydi.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osonnavbat}
      POSTGRES_USER: ${POSTGRES_USER:-osonnavbat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD .env da ko'rsatilmagan}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ⚠️ `ports:` ataylab yo'q — bazaga faqat shu tarmoqdagi konteynerlar kiradi.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osonnavbat}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    # ⚠️ `ports:` ataylab yo'q — parolsiz Redis internetga chiqmasligi kerak.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - media:/app/media
      - static:/app/staticfiles
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Navbat eslatmalari: har 15 daqiqada bir marta bazani tekshiradi.
  # `entrypoint` ataylab almashtirilgan — migratsiya/collectstatic'ni faqat `api`
  # bajarsin, ikkalasi bir vaqtda migratsiya qilib qolmasin.
  cron:
    build: .
    restart: unless-stopped
    env_file: .env
    # Dockerfile'dagi HEALTHCHECK `:8000/health/` ga uradi — bu konteynerda esa
    # veb-server yo'q, shuning uchun u abadiy "unhealthy" bo'lib turardi.
    healthcheck:
      disable: true
    entrypoint: ["/bin/sh", "-c"]
    # Birinchi tsiklgacha kutamiz: `api` migratsiyalarni qo'llab ulgurmasdan
    # turib ishga tushsak, "column ... does not exist" xatosi chiqadi.
    # `api` ni `service_healthy` qilib kutish kifoya emas — u healthcheck'ni
    # migratsiyadan keyin o'tkazadi, lekin biz baribir zaxira sifatida
    # birinchi urinishni kechiktiramiz.
    command: >
      'sleep 60;
       while :; do
         python manage.py send_booking_reminders || echo "eslatma buyrugi xato berdi";
         sleep 900;
       done'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # conf.d dan TASHQARIDA — aks holda nginx uni http{} ga ham avtomatik
      # qo'shib yuboradi (conf.d/*.conf hammasi include qilinadi).
      - ./deploy/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - media:/var/www/media:ro
      - static:/var/www/static:ro
    depends_on:
      - api

  # Sertifikatni har 12 soatda yangilab turadi (Let's Encrypt 90 kun beradi).
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
             while :; do certbot renew --webroot -w /var/www/certbot --quiet;
             sleep 12h & wait $${!}; done"

volumes:
  pgdata:
  media:
  static:
