  /api/v1/barber/me/stats/:
    get:
      operationId: barber_me_stats_retrieve
      description: Usta uchun daromad va navbatlar statistikasi.
      summary: Usta statistikasi
      parameters:
      - in: query
        name: period
        schema:
          type: string
        description: '`day` | `week` | `month` (default) | `year` | `all`'
      tags:
      - barber-panel
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/v1/barbers/:
    get:
      operationId: barbers_list
      description: '`?lat=&lng=&radius=` bo''yicha masofa hisoblash va saralash.'
      summary: Ustalar ro'yxati / xarita
      parameters:
      - in: query
        name: city
        schema:
          type: string
      - in: query
        name: district
        schema:
          type: string
      - in: query
        name: lat
        schema:
          type: number
          format: float
        description: Foydalanuvchi kengligi (Yandex Maps)
      - in: query
        name: lng
        schema:
          type: number
          format: float
        description: Foydalanuvchi uzunligi
      - in: query
        name: max_price
        schema:
          type: number
        description: Eng arzon xizmat narxi bo'yicha
      - in: query
        name: min_rating
        schema:
          type: number
          format: float
      - in: query
        name: ordering
        schema:
          type: string
        description: '`distance`, `-rating_avg`, `rating_avg`, `-reviews_count`, `name`'
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: radius
        schema:
          type: number
          format: float
        description: 'Qidiruv radiusi, km (default: cheklovsiz)'
      - in: query
        name: salon
        schema:
          type: string
          format: uuid
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: specialty
        schema:
          type: array
          items:
            type: string
            title: Mutaxassislik
            enum:
            - kids
            - men
            - unisex
            - women
        description: |-
          men | women | kids | unisex (bir nechta bo'lishi mumkin)

          * `men` - Erkaklar
          * `women` - Ayollar
          * `kids` - Bolalar
          * `unisex` - Aralash
        explode: true
        style: form
      tags:
      - barbers
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBarberListList'
          description: ''
  /api/v1/barbers/{id}/:
    get:
      operationId: barbers_retrieve
      description: '`?lat=&lng=&radius=` bo''yicha masofa hisoblash va saralash.'
      summary: Usta tafsilotlari (jadval bilan)
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: A UUID string identifying this usta.
        required: true
      tags:
      - barbers
      security:
      - {}
      responses:
