  /api/v1/notifications/:
    get:
      operationId: notifications_list
      description: Faqat joriy foydalanuvchining xabarlari. `?is_read=false` bilan
        filtrlash mumkin.
      summary: Xabarnomalar tarixi
      parameters:
      - name: ordering
        required: false
        in: query
