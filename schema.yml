        schema:
          type: string
          format: uuid
        description: A UUID string identifying this usta.
        required: true
      - in: query
        name: service
        schema:
          type: string
        description: Xizmat nomi (davomiylikni hisobga olish uchun)
      tags:
      - barbers
      security:
