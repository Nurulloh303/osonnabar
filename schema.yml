openapi: 3.0.3
info:
  title: osonNavbat API
  version: 1.0.0
  description: |-
    Sartaroshxona va go'zallik salonlari uchun onlayn navbat platformasi.

    **Autentifikatsiya:** JWT tokenlar `httpOnly` cookie'da saqlanadi (`on_access` / `on_refresh`). Har bir o'zgartiruvchi so'rovda `X-CSRFToken` header'i talab qilinadi — tokenni `GET /api/v1/auth/csrf/` orqali oling. Swagger'dan test qilish uchun `Authorization: Bearer <token>` ham qo'llab-quvvatlanadi.
paths:
  /api/v1/auth/csrf/:
    get:
      operationId: auth_csrf_retrieve
      description: |-
        Frontend ilova yuklanishida bir marta chaqiradi va `csrftoken` cookie'sini oladi.

        Keyingi POST/PATCH/DELETE so'rovlarda shu qiymatni `X-CSRFToken` header'iga qo'yish kerak.
      summary: CSRF token olish
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/auth/google/:
    post:
      operationId: auth_google_create
      description: Google Sign-In `id_token`ini tekshirib, sessiya ochadi.
      summary: Google orqali kirish
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/GoogleAuthRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Cookie'larni o'chiradi.
      summary: Chiqish
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Joriy foydalanuvchi profili (o'qish / `full_name` yangilash).
      tags:
      - auth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      description: Joriy foydalanuvchi profili (o'qish / `full_name` yangilash).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Joriy foydalanuvchi profili (o'qish / `full_name` yangilash).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/v1/auth/me/avatar/:
    post:
      operationId: auth_me_avatar_create
      description: Profil rasmini yuklash (multipart/form-data).
      summary: Avatar yuklash
      tags:
      - auth
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvatarUploadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AvatarUploadRequest'
          application/json:
            schema:
              $ref: '#/components/schemas/AvatarUploadRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    delete:
      operationId: auth_me_avatar_destroy
      description: Profil rasmini yuklash (multipart/form-data).
      summary: Avatarni o'chirish
      tags:
      - auth
      responses:
        '204':
          description: No response body
  /api/v1/auth/methods/:
    get:
      operationId: auth_methods_retrieve
      description: |-
        Frontend qaysi kirish usullarini ko'rsatishini shu yerdan biladi.

        Google tugmasi uchun `google_client_id` ham qaytariladi — u maxfiy emas,
        brauzerda baribir ochiq ko'rinadi.
      summary: Mavjud kirish usullari
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMethods'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: '`on_refresh` cookie''si asosida yangi access token beradi (rotatsiya
        bilan).'
      summary: Tokenni yangilash
      tags:
      - auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
          description: ''
