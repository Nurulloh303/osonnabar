  /api/v1/bookings/:
    get:
      operationId: bookings_list
      description: |-
        Mijoz — o'z bronlarini, usta — o'ziga tushgan bronlarni, super admin — hammasini ko'radi.

        Filtrlar: `?status=pending&status=confirmed`, `?scope=upcoming|past|today`, `?date_from=&date_to=`.
      summary: Navbatlar ro'yxati
      parameters:
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: scope
        schema:
          type: string
        description: upcoming | past | today
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - bookings
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBookingList'
          description: ''
    post:
      operationId: bookings_create
      summary: Navbatga yozilish
      tags:
      - bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreateRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreate'
          description: ''
  /api/v1/bookings/{id}/:
    get:
      operationId: bookings_retrieve
      summary: Bitta navbat
      parameters:
      - in: path
        name: id
        schema:
          type: string
