# api.qulaynavbat.uz — reverse proxy + TLS + statik/media
#
# Bu fayl nginx'ning `http { }` bloki ichiga qo'shiladi (conf.d/default.conf).

# ── Himoya qatlami: Django throttling'dan oldingi "eshik" ────────────────
# Django limitlari asosiy, bu esa server protsessorini himoya qiladi:
# OTP endpoint'iga sekundiga 1 ta so'rov (portlash uchun 5 ta zaxira).
limit_req_zone $binary_remote_addr zone=otp_zone:10m rate=1r/s;
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;

upstream osonnavbat_api {
    server api:8000;
    keepalive 32;
}

# ── HTTP: faqat ACME tekshiruvi va HTTPS'ga yo'naltirish ─────────────────
server {
    listen 80;
    listen [::]:80;
    server_name api.qulaynavbat.uz;

    # Let's Encrypt sertifikat so'raganda shu manzilni tekshiradi.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.qulaynavbat.uz;

    ssl_certificate     /etc/letsencrypt/live/api.qulaynavbat.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.qulaynavbat.uz/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling        on;
    ssl_stapling_verify on;

    # Avatar/muqova yuklash uchun. `MAX_UPLOAD_SIZE` (5 MB) dan sal kattaroq —
    # nginx emas, Django tushunarli xato matnini qaytarsin.
    client_max_body_size 8m;
    client_body_timeout  30s;

    # nginx versiyasi ko'rinmasin
    server_tokens off;

    # ⚠️ Bu yerda xavfsizlik header'lari ATAYLAB yo'q. Django (SecurityMiddleware)
    # ularni API javoblariga o'zi qo'shadi — server darajasida takrorlasak, har bir
    # javobda ikki nusxa ketardi. `/media/` va `/static/` ga esa Django umuman
    # tegmaydi, shuning uchun o'sha location'larda alohida qo'yilgan.

    gzip on;
    gzip_types application/json application/javascript text/css text/plain;
    gzip_min_length 1024;

    # ── Yuklangan rasmlar ────────────────────────────────────────────────
    location /media/ {
        alias /var/www/media/;
        expires 30d;
        access_log off;
        add_header X-Content-Type-Options nosniff always;
        # Media papkasiga qandaydir yo'l bilan HTML tushib qolsa ham, u
        # brauzerda skript sifatida ishlay olmasin.
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }

    # ── Django statikasi (admin, swagger) ────────────────────────────────
    location /static/ {
        alias /var/www/static/;
        expires 30d;
        access_log off;
        add_header X-Content-Type-Options nosniff always;
    }

    location = /health/ {
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://osonnavbat_api;
        access_log off;
    }

    # ── OTP: qat'iyroq limit (SMS pul turadi) ────────────────────────────
    location /api/v1/auth/otp/ {
        limit_req zone=otp_zone burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://osonnavbat_api;
    }

    location / {
        limit_req zone=api_zone burst=50 nodelay;
        limit_req_status 429;
        include /etc/nginx/proxy_params.conf;
        proxy_pass http://osonnavbat_api;
    }
}
