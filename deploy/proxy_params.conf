# Django/DRF ga uzatiladigan header'lar.
#
# ⚠️ `$proxy_add_x_forwarded_for` mijoz yuborgan zanjirning OXIRIGA haqiqiy IP ni
# qo'shadi. DRF `NUM_PROXIES=1` bilan aynan oxirgi elementni oladi — shuning uchun
# hujumchi o'zi X-Forwarded-For yozib yuborsa ham throttle limitini aylanib o'ta olmaydi.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

proxy_http_version 1.1;
proxy_set_header Connection "";

proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

proxy_redirect off;
